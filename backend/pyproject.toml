[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiolimiter>=1.2.1",
    "chromadb>=1.5.9",
    "fastapi>=0.136.3",
    "google-api-core>=2.25.2",
    "google-generativeai>=0.8.6",
    "ladybug>=0.17.1",
    "langchain>=1.3.6",
    "langchain-community>=0.4.2",
    "langgraph>=1.2.4",
    "pydantic>=2.13.4",
    "pypdf>=6.13.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.50",
    "tree-sitter>=0.25.2",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.26.7",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
reverie = "app.cli:app"

[tool.uv]
package = true

[tool.setuptools]
packages = ["app"]
